version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # 所有 action 的更新合成一个 PR，避免每周开一堆单条升级
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    groups:
      extension-deps:
        patterns: ["*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
